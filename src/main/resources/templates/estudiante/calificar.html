<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificar tutor — Agenda Tutorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <style>
        .rating-options {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 6px;
        }
        .rating-options input {
            display: none;
        }
        .rating-options label {
            font-size: 2rem;
            color: #d5dbe1;
            cursor: pointer;
            transition: color .15s;
        }
        .rating-options label:hover,
        .rating-options label:hover ~ label,
        .rating-options input:checked ~ label {
            color: #f1c40f;
        }
    </style>
</head>
<body>

<nav class="navbar-top" aria-label="Navegación principal">
    <div class="navbar-left">
        <a th:href="@{/estudiante/dashboard}" class="navbar-brand" aria-label="Inicio">
            <img th:src="@{/img/logo.png}" alt="Comfenalco" onerror="this.style.display='none'">
        </a>
        <div class="navbar-sep-v"></div>
        <nav class="navbar-nav-links" aria-label="Secciones">
            <a th:href="@{/estudiante/dashboard}" class="nav-link">Inicio</a>
            <a th:href="@{/estudiante/tutores}" class="nav-link">
                <i class="bi bi-search" aria-hidden="true"></i> Buscar tutor
            </a>
        </nav>
    </div>
    <div class="navbar-right">
        <a th:href="@{/estudiante/billetera}" class="navbar-util-btn" aria-label="Mi billetera">
            <i class="bi bi-wallet2" aria-hidden="true"></i>
            <span th:text="'$' + ${#numbers.formatDecimal(usuario.balance ?: 0, 0, 'COMMA', 0, 'POINT')}">$0</span>
        </a>
        <a th:href="@{/notificaciones}" class="navbar-util-btn navbar-bell" aria-label="Notificaciones">
            <i class="bi bi-bell" aria-hidden="true"></i>
            <span th:if="${noLeidas > 0}" class="bell-badge" th:text="${noLeidas}"></span>
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card-institucional">
                <div class="card-header-azul">
                    <i class="bi bi-star me-2"></i>Calificar a tu tutor
                </div>
                <div class="p-4">

                    <div class="text-center mb-4">
                        <div style="width:80px;height:80px;border-radius:50%;
                                    background:linear-gradient(135deg,var(--azul),var(--azul-medio));
                                    display:flex;align-items:center;justify-content:center;
                                    font-size:2rem;color:white;margin:0 auto 12px;">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <h4 style="font-family:'Merriweather',serif; color:var(--azul); margin-bottom:4px;"
                            th:text="${profesor != null ? profesor.nombre : tutoria.profesorNombre}">Tutor</h4>
                        <p style="color:#7f8c8d; margin:0;"
                           th:text="${tutoria.materia} + ' · ' + ${#temporals.format(tutoria.fechaHora, 'dd/MM/yyyy HH:mm')}">
                        </p>
                    </div>

                    <form th:action="@{/estudiante/tutorias/{id}/calificar(id=${tutoria.id})}" method="post">
                        <label class="form-label d-block text-center mb-2">¿Cómo fue tu experiencia?</label>

                        <div class="rating-options mb-4">
                            <input type="radio" id="star5" name="puntuacion" value="5" required>
                            <label for="star5" title="5 estrellas"><i class="bi bi-star-fill"></i></label>

                            <input type="radio" id="star4" name="puntuacion" value="4">
                            <label for="star4" title="4 estrellas"><i class="bi bi-star-fill"></i></label>

                            <input type="radio" id="star3" name="puntuacion" value="3">
                            <label for="star3" title="3 estrellas"><i class="bi bi-star-fill"></i></label>

                            <input type="radio" id="star2" name="puntuacion" value="2">
                            <label for="star2" title="2 estrellas"><i class="bi bi-star-fill"></i></label>

                            <input type="radio" id="star1" name="puntuacion" value="1">
                            <label for="star1" title="1 estrella"><i class="bi bi-star-fill"></i></label>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Comentario (opcional)</label>
                            <textarea name="comentario" class="form-control" rows="3"
                                      placeholder="Cuéntale a otros estudiantes cómo fue la tutoría..."></textarea>
                        </div>

                        <button type="submit" class="btn-primario w-100 justify-content-center">
                            <i class="bi bi-send"></i> Enviar calificación
                        </button>
                        <a th:href="@{/estudiante/dashboard}" class="btn-secundario w-100 justify-content-center mt-2">
                            Volver al inicio
                        </a>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
